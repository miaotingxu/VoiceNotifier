# VoiceNotifier 配置文件（保存为 UTF-8）

[url]
# 获取播报通知的接口地址。
getVoice=http://localhost:8099/wms/extendAPI/getBroadcastVoice

[polling]
# 正常情况下两次请求之间的间隔，单位：秒。
intervalSeconds=2
# 单次请求最多等待多久，超时后认为服务暂时不可用，单位：秒。
requestTimeoutSeconds=10
# 请求失败后等待多久再重试，单位：秒。
retryIntervalSeconds=5
# 是否启用自动轮询。true=启用，false=暂停但保留托盘程序。
enabled=true

[speech]
# 语速：0 为正常，负数较慢，正数较快，范围 -10 到 10。
rate=0
# 音量：0 到 100。
volume=100
# 两次播报的最短间隔，单位：秒。0 表示每次成功请求都播报。
cooldownSeconds=0

[logging]
# 日志保留天数。超过该天数的日志文件会自动删除。
retentionDays=30
# 单个日志文件的最大大小，单位：MB。达到上限后自动创建新的日志文件。
maxFileSizeMb=10
